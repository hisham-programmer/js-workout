<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Event Listener</title>
    <link rel='stylesheet' href=''>
</head>
<body>
    <button id="btn">Click</button>
    <p id="para"></p>
    <script>
        let element=document.getElementById('btn').addEventListener(
            "click",
            function(){
                document.getElementById('para').textContent="Button Is Clicked";
            }
        );
    </script>
</body>
</html>
