<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Alert and Prompts</title>
    <script>
        alert("Hello Welcome To My Website");
       let name=prompt("What is your name","Guest");
       let issure=confirm("Are you want to continue");
       if(name){
        alert("Hello",name)
       }
       else{
       alert("You are not entered your name yet ")
      }
      if(issure){
        console.log("user confirmed")
       }
       else{
        console.log("user not confirmed")
      }
      
    </script>
</head>

</body>
</html>
